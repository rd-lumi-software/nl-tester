[package]
name = "lumi-tester"
version = "0.1.45"
edition = "2021"
description = "Multi-platform automation testing CLI"
repository = "https://github.com/Nghi-NV/nl-tester"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Async runtime
tokio = { version = "1.36", features = ["full", "process"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
regex = "1.10"
csv = "1.3"
chrono = "0.4"
glob = "0.3"
walkdir = "2.4"
dirs = "5.0"
which = "5.0"
uuid = { version = "1.0", features = ["v4"] }
zip = "0.6"

# UI/Output
colored = "2.1"
indicatif = "0.17"

# Signal handling
ctrlc = "3.4"

# Logging
log = "0.4"
env_logger = "0.10"

# Image processing
image = { version = "0.24", features = ["gif", "webp"] }
imageproc = "0.23"

# XML parsing (for UI hierarchy)
quick-xml = "0.31"

# Async traits
async-trait = "0.1"

# Mock Data & Random
fake = { version = "2.9", features = ["derive"] }
rand = "0.8"

# HTTP Client
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Crypto (Lark Signature)
hmac = "0.12"
sha2 = "0.10"

# Web Testing (Chrome DevTools Protocol, native)
chromiumoxide = "0.9"

# JavaScript Engine
boa_engine = "0.19"

# Database
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "any", "postgres", "mysql", "sqlite"] }

# Web Server (Inspector UI)
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
base64 = "0.21"
libc = "0.2.180"
futures = "0.3.31"
ocrs = "0.12.0"
rten = "0.24.0"
rten-imageproc = "0.24.0"

# Serial Communication (Hardware Control)
serialport = "4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
