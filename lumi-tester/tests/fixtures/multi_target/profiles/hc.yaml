implementation: lumi_iot_v3_home_controller
protocolPack: lumi_iot_v3_home_controller
protocolVersion: "0.2.0"
packVersion: "0.1.0"
target:
  chip: deterministic_mock
  firmware: mock-1
endpoint:
  baseUrl: http://127.0.0.1:1
  websocketUrl: ws://127.0.0.1:1/ws
auth:
  mode: none
capabilities:
  - health
  - device_discovery
  - device_state
  - device_control
  - realtime_cell_readback
evidence:
  root: output/mock-hc
  maxRawBytes: 4096
  maxWebSocketFrames: 32
  redactFields:
    - dev_key
    - nwk_key
    - app_key
    - authorization
    - cookie
    - token
retry:
  safeHttpMaxAttempts: 3
  controlMaxAttempts: 0
  websocketReconnectMaxAttempts: 1
mock: true
